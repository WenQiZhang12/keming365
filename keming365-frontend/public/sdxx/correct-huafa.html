<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在线批改</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: "Microsoft YaHei", Arial, sans-serif; color: #111827; background: #fff; }
    body { padding: 0; overflow-x: hidden; }
    .correct-page { width: 100%; min-height: 600px; background: #fff; }
    .task-bar { height: 69px; padding: 0 31px; display: flex; align-items: center; justify-content: space-between; color: #fff; background: linear-gradient(100deg, #234aa5 0%, #2c64d9 54%, #3678f4 100%); }
    .task-title { font-size: 22px; font-weight: 700; letter-spacing: 0; }
    .task-note { font-size: 16px; font-weight: 700; white-space: nowrap; }
    .status-row { height: 54px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid #e5e7eb; font-size: 14px; color: #6b7280; white-space: nowrap; }
    .status-row strong { margin-left: 8px; color: #020617; font-size: 16px; font-weight: 800; }
    .status-row .green { color: #00ad70; }
    .content { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 496px; background: #f2f5fa; }
    .sheet-zone { padding: 20px; border-right: 1px solid #dce3ee; }
    .sheet-card { max-width: 557px; height: 461px; margin: 0 auto; border-radius: 10px; background: #fff; box-shadow: 0 6px 18px rgba(15, 23, 42, .08); overflow: hidden; }
    .paper-img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .result-panel { padding: 22px 20px; background: #fff; }
    .result-title { margin: 0 0 14px; padding-bottom: 12px; border-bottom: 2px solid #2f7df6; font-size: 18px; font-weight: 800; color: #0f172a; }
    .score-card { padding: 17px 16px; border-radius: 6px; background: #e8fbf3; color: #111827; }
    .score-card h3 { margin: 0 0 16px; color: #00a66c; font-size: 16px; }
    .score-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid rgba(0, 128, 96, .12); font-size: 14px; }
    .score-row strong { color: #07111f; }
    .score-circle { width: 58px; height: 58px; margin-top: 13px; border-radius: 50%; background: #10b981; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; line-height: 1.05; }
    .score-circle span { font-size: 22px; }
    .score-circle em { font-style: normal; font-size: 12px; }
    .ops { margin-top: 16px; padding-top: 21px; border-top: 1px solid #e5e7eb; }
    .ops-title { margin-bottom: 13px; font-size: 15px; font-weight: 800; }
    .btn { width: 100%; height: 48px; border: 0; border-radius: 6px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn.primary { color: #fff; background: #3b82f6; }
    .btn.secondary { margin-top: 10px; color: #1f2937; background: #f3f4f6; border: 1px solid #e5e7eb; }
    @media (max-width: 760px) {
      .task-bar, .status-row { padding-left: 16px; padding-right: 16px; }
      .status-row { height: auto; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; gap: 10px 18px; }
      .content { grid-template-columns: 1fr; }
      .result-panel { border-top: 1px solid #e5e7eb; }
    }
  </style>
</head>
<body>
  <main class="correct-page">
    <header class="task-bar">
      <div class="task-title">自动批改作业</div>
      <div class="task-note">系统会在后端保留任务</div>
    </header>
    <section class="status-row" aria-label="批改状态">
      <span>当前状态：<strong>已完成</strong></span>
      <span>最近提交：<strong>2026-05-19 10:27:14</strong></span>
      <span>当前视图：<strong>学生作业</strong></span>
      <span>成绩：<strong>100/100</strong></span>
      <span>置信度：<strong class="green">98%</strong></span>
    </section>
    <section class="content">
      <div class="sheet-zone">
        <div class="sheet-card">
          <img class="paper-img" src="/sdxx/assets/correct-paper-huafa.png" alt="学生制图作业">
        </div>
      </div>
      <aside class="result-panel">
        <h2 class="result-title">批改结果</h2>
        <div class="score-card">
          <h3>状态说明</h3>
          <div class="score-row"><span>批改状态</span><strong>已完成</strong></div>
          <div class="score-row"><span>任务编号</span><strong>qtest_20260518102714</strong></div>
          <div class="score-row"><span>得分</span><strong>100 / 100</strong></div>
          <div class="score-circle"><span>100</span><em>满分</em></div>
        </div>
        <div class="ops">
          <div class="ops-title">作业操作</div>
          <button class="btn primary" type="button">上传作业</button>
          <button class="btn secondary" type="button">查看答案</button>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
