<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱</title>
<link rel="stylesheet" href="https://unpkg.com/jsmind@0.8.5/style/jsmind.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://unpkg.com/jsmind@0.8.5/js-legacy/jsmind.js"></script>
<script src="https://unpkg.com/jsmind@0.8.5/js-legacy/jsmind.draggable-node.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f5f7fa; }

#jsmind_container { width: 100%; height: 100%; }

/* 知识点侧边面板 */
.kp-panel {
  position: fixed; top: 0; right: 0; width: 420px; max-width: 85vw; height: 100vh;
  background: #fff; z-index: 1000; box-shadow: -4px 0 24px rgba(0,0,0,0.12);
  display: flex; flex-direction: column;
  animation: slideRight 0.3s ease;
}
@keyframes slideRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
.kp-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid #eee; flex-shrink: 0;
}
.kp-header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.kp-header-left .icon { font-size: 20px; flex-shrink: 0; }
.kp-header-left h3 { font-size: 16px; color: #1a1a2e; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kp-collapse {
  border: none; background: none; cursor: pointer; font-size: 13px;
  color: #999; padding: 4px 10px; border-radius: 4px; flex-shrink: 0;
}
.kp-collapse:hover { background: #f5f5f5; color: #666; }
.kp-body { flex: 1; overflow-y: auto; padding: 20px; }
.kp-section { margin-bottom: 20px; }
.kp-tag {
  display: inline-block; padding: 3px 12px; border-radius: 12px;
  font-size: 12px; font-weight: 600; margin-bottom: 10px;
}
.kp-tag-orange { background: #ff9800; color: #fff; }
.kp-desc-label {
  display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
  font-size: 14px; color: #333; font-weight: 500;
}
.kp-desc-icon {
  width: 20px; height: 20px; border-radius: 50%; background: #4a7dff;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: bold;
}
.kp-content-card {
  background: #f8f9fc; border-radius: 10px; padding: 16px;
  font-size: 14px; line-height: 1.9; color: #333;
}
.kp-content-card img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px 0; }
.kp-content-card table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.kp-content-card td, .kp-content-card th { border: 1px solid #ddd; padding: 6px 10px; font-size: 13px; }
.kp-content-card th { background: #f0f2f8; }
.kp-vr-section { margin-top: 8px; }
.kp-vr-title {
  display: flex; align-items: center; gap: 6px; font-size: 14px;
  font-weight: 500; color: #333; margin-bottom: 10px;
}
.kp-vr-icon { font-size: 18px; }
.kp-vr-item {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  border-radius: 8px; margin-bottom: 8px; background: #f8f9ff;
  border: 1px solid #e8ecf4; cursor: pointer; transition: background 0.15s;
}
.kp-vr-item:hover { background: #eef1ff; }
.kp-vr-item-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; flex-shrink: 0;
}
.kp-vr-item-title { font-size: 13px; color: #1a1a2e; font-weight: 500; }
.kp-vr-item-type { font-size: 11px; color: #999; margin-top: 2px; }
.kp-empty { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; }
.kp-mask {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.15); z-index: 999;
}

/* 加载 */
.loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f5f7fa; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.loading-spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: #4a7dff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #888; }

.error-box { text-align: center; padding: 60px 20px; }
.error-box .icon { font-size: 48px; margin-bottom: 16px; }
.error-box .msg { font-size: 15px; color: #666; margin-bottom: 20px; }
.error-box button { padding: 8px 24px; background: #4a7dff; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div id="loading" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在加载知识图谱...</div>
</div>
<div id="jsmind_container"></div>

<script>
(function() {
  var COLORS = ['#FFB6C1','#87CEFA','#FFD700','#98FB98','#FFA07A','#9370DB','#87CEEB','#DDA0DD'];
  var params = new URLSearchParams(window.location.search);
  var lessonId = params.get('lessonId') || '2';
  var API_BASE = params.get('apiBase') || 'https://www.keming365.com';

  function fetchAtlas() {
    return fetch(API_BASE + '/ai/lessons/atlas/' + lessonId)
      .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(json) { return json.data || json; });
  }

  function convertToJsMind(apiNode, depth) {
    depth = depth || 0;
    var color = COLORS[depth % COLORS.length];
    var node = {
      id: String(apiNode.id),
      topic: apiNode.topic || '',
      'background-color': color,
      'foreground-color': depth === 0 ? '#333' : '#222'
    };
    if (depth === 0) { node.expanded = true; }
    else if (depth === 1) { node.direction = (parseInt(apiNode.id) % 2 === 0) ? 'right' : 'left'; node.expanded = false; }
    else { node.expanded = false; }
    node.data = { nodeKnowledge: apiNode.nodeKnowledge || [], vrResources: apiNode.vrList || [] };
    if (apiNode.children && apiNode.children.length > 0) {
      node.children = apiNode.children.map(function(c) { return convertToJsMind(c, depth + 1); });
    }
    return node;
  }

  function cleanFormula(f) {
    return f.trim()
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, ' ')
      .trim();
  }

  function renderKatex(html) {
    if (!html || !window.katex) return html || '';
    html = html.replace(/\$\$([\s\S]*?)\$\$/g, function(m, f) { try { return katex.renderToString(cleanFormula(f), {displayMode:true,throwOnError:false}); } catch(e) { return m; } });
    html = html.replace(/\\\[([\s\S]*?)\\\]/g, function(m, f) { try { return katex.renderToString(cleanFormula(f), {displayMode:true,throwOnError:false}); } catch(e) { return m; } });
    html = html.replace(/\$([^\$\n]+?)\$/g, function(m, f) { try { return katex.renderToString(cleanFormula(f), {displayMode:false,throwOnError:false}); } catch(e) { return m; } });
    return html;
  }

  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function closePanel() {
    var panel = document.getElementById('kpPanel');
    var mask = document.getElementById('kpMask');
    if (panel) panel.remove();
    if (mask) mask.remove();
  }

  function bindVrEvents(panel) {
    panel.querySelectorAll('.kp-vr-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var id = this.getAttribute('data-appliid');
        var title = this.querySelector('.kp-vr-item-title');
        var vrTitle = title ? title.textContent : 'VR资源';
        if (id) {
          // 弹出 VR 悬浮窗（带 iframe）
          var oldOv = document.getElementById('vrOverlay');
          if (oldOv) oldOv.remove();
          var vrOverlay = document.createElement('div');
          vrOverlay.id = 'vrOverlay';
          vrOverlay.className = 'kp-mask';
          vrOverlay.style.zIndex = '1001';
          vrOverlay.innerHTML = '<div style="background:#fff;border-radius:12px;width:560px;max-width:92vw;height:75vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,0.25);animation:slideRight 0.25s ease;">' +
            '<div class="kp-header"><div class="kp-header-left"><span class="icon">🔬</span><h3>' + escapeHtml(vrTitle) + '</h3></div>' +
            '<button class="kp-collapse" id="vrCloseBtn">收起</button></div>' +
            '<div style="flex:1;overflow:hidden;"><iframe src="https://yq.keming365.com/webclient/?appliId=' + escapeHtml(id) + '" style="width:100%;height:100%;border:none;"></iframe></div></div>';
          vrOverlay.addEventListener('click', function(ev) { if (ev.target === vrOverlay) vrOverlay.remove(); });
          document.body.appendChild(vrOverlay);
          document.getElementById('vrCloseBtn').addEventListener('click', function() { vrOverlay.remove(); });
        }
      });
    });
  }

  function showNodePanel(topic, knowledgeList, vrList) {
    closePanel();

    var mask = document.createElement('div');
    mask.id = 'kpMask';
    mask.className = 'kp-mask';
    mask.addEventListener('click', closePanel);
    document.body.appendChild(mask);

    var panel = document.createElement('div');
    panel.id = 'kpPanel';
    panel.className = 'kp-panel';

    var bodyHtml = '';

    var hasKnowledge = knowledgeList && knowledgeList.length > 0 && knowledgeList.some(function(k) { return k.nodeKnowledge; });
    if (hasKnowledge) {
      bodyHtml += '<div class="kp-section">';
      bodyHtml += '<div class="kp-tag kp-tag-orange">知识点</div>';
      bodyHtml += '<div class="kp-desc-label"><div class="kp-desc-icon">i</div>描述</div>';
      bodyHtml += '<div class="kp-content-card">';
      knowledgeList.forEach(function(item) {
        if (item.nodeKnowledge) bodyHtml += renderKatex(item.nodeKnowledge);
      });
      bodyHtml += '</div></div>';
    }

    if (vrList && vrList.length > 0) {
      bodyHtml += '<div class="kp-section kp-vr-section">';
      bodyHtml += '<div class="kp-vr-title"><span class="kp-vr-icon">🔬</span>VR资源</div>';
      vrList.forEach(function(vr) {
        bodyHtml += '<div class="kp-vr-item" data-appliid="' + escapeHtml(vr.appliId||'') + '">';
        bodyHtml += '<div class="kp-vr-item-icon">🔬</div>';
        bodyHtml += '<div><div class="kp-vr-item-title">' + escapeHtml(vr.title||'VR资源') + '</div>';
        bodyHtml += '<div class="kp-vr-item-type">' + escapeHtml(vr.typeStr||'虚拟仿真') + '</div></div>';
        bodyHtml += '</div>';
      });
      bodyHtml += '</div>';
    }

    if (!hasKnowledge && (!vrList || vrList.length === 0)) {
      bodyHtml = '<div class="kp-empty">该节点暂无详细内容</div>';
    }

    panel.innerHTML = '<div class="kp-header">' +
      '<div class="kp-header-left"><span class="icon">📖</span><h3>' + escapeHtml(topic) + '</h3></div>' +
      '<button class="kp-collapse" id="kpCollapseBtn">收起</button></div>' +
      '<div class="kp-body">' + bodyHtml + '</div>';

    document.body.appendChild(panel);

    document.getElementById('kpCollapseBtn').addEventListener('click', closePanel);
    bindVrEvents(panel);
  }

  function initJsMind(apiData) {
    var mindData = convertToJsMind(apiData, 0);
    var options = {
      container: 'jsmind_container', editable: false, theme: 'primary', mode: 'full', support_html: true,
      view: { draggable: true, hide_scrollbars_when_draggable: false, node_overflow: 'hidden', zoom: { min: 0.3, max: 2.0, step: 0.1 } },
      shortcut: { enable: true, handles: {}, mapping: { zoomin: '=', zoomout: '-' } }
    };
    var jm = new jsMind(options);
    jm.show({ meta: { name: '知识图谱', author: 'KM365', version: '1.0' }, format: 'node_tree', data: mindData });

    document.getElementById('jsmind_container').addEventListener('click', function(e) {
      // 只有点击节点本身才弹出面板，点击+/-展开按钮不弹
      var el = e.target;
      while (el && el !== this) {
        if (el.tagName && el.tagName.toLowerCase() === 'jmnode') break;
        el = el.parentNode;
      }
      if (!el || el === this) return;
      var nodeId = el.getAttribute('nodeid');
      if (!nodeId) return;
      var node = jm.get_node(nodeId);
      if (!node) return;
      var data = (node.data && node.data.data) || node.data || {};
      var kl = data.nodeKnowledge || [], vr = data.vrResources || [];
      var hasK = kl.length > 0 && kl.some(function(k) { return k.nodeKnowledge; });
      var hasVr = vr.length > 0;
      if (hasK || hasVr) {
        showNodePanel(node.topic, kl, vr);
      }
    });
    return jm;
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('jsmind_container').innerHTML = '<div class="error-box"><div class="icon">⚠️</div><div class="msg">' + escapeHtml(msg) + '</div><button onclick="location.reload()">重新加载</button></div>';
  }

  fetchAtlas()
    .then(function(data) { document.getElementById('loading').style.display = 'none'; initJsMind(data); })
    .catch(function(err) { showError('知识图谱加载失败：' + (err.message || '未知错误')); });
})();
</script>
</body>
</html>
